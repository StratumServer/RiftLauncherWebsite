name: Pages

on:
  push:
    branches: [main]
  # The build reads docs/ and the background catalog from the launcher repository and the releases
  # from its API, so it runs again every quarter hour and picks up a new release, a docs merge or
  # moved download counters without anyone touching this repository. Actions minutes are free on a
  # public repository, and fetching at build time is what keeps visitors' browsers from calling
  # third parties.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  # The build records one download total a day into data/downloads-history.json and pushes it back,
  # whatever the run frequency: the history keeps one point per day, the extra runs only redeploy.
  # which is the only thing on this repository that writes.
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Reads the freshness stamp off the live page and compares it with the sources' current state, so
  # a quarter-hour tick where nothing moved ends here in seconds. Push and manual runs skip the
  # gate. If the live page or its stamp cannot be read, the answer is "changed", never "skip".
  check:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - id: compare
        run: |
          set -u
          live=$(curl -sf --max-time 20 "https://riftlauncher.stratumvs.dev/" | grep -o 'name="build-sources" content="[^"]*"' || true)
          dev=$(git ls-remote https://github.com/StratumServer/RiftLauncher.git refs/heads/dev | cut -c1-12)
          bg=$(git ls-remote https://github.com/StratumServer/RiftLauncher.git refs/heads/backgrounds | cut -c1-12)
          rel=$(curl -sf --max-time 20 "https://api.github.com/repos/StratumServer/RiftLauncher/releases?per_page=1" | grep -m1 '"id":' | grep -o '[0-9]*' | head -1 || echo unavailable)
          today=$(date -u +%F)
          echo "live:    $live"
          echo "wanted:  dev:$dev bg:$bg rel:$rel at:$today"
          if [ -n "$live" ] && echo "$live" | grep -q "dev:$dev " && echo "$live" | grep -q "bg:$bg " && echo "$live" | grep -q "rel:$rel " && echo "$live" | grep -q "at:$today"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing moved, skipping the build."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: [check]
    if: always() && (github.event_name != 'schedule' || needs.check.outputs.changed == 'true')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          # The GitHub API only ever says how many downloads there have been, never when they
          # happened. RECORD_DOWNLOADS makes the build keep today's total, so a year from now the
          # site has a curve nobody had to collect by hand.
          RECORD_DOWNLOADS: "1"
      # Keeping the point is not worth failing a deploy over: if the API was down the build already
      # skipped the section and wrote nothing, and there is simply nothing to commit.
      - name: Keep today's download totals
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/downloads-history.json
          git diff --cached --quiet || { git commit -m "Record download totals for $(date -u +%F)" && git push; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
